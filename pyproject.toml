[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitocensus"
version = "0.3.1"
description = "Object-level quality control for mitochondrial morphometry in volume electron microscopy"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MitoCensus contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "tifffile>=2024.1",
  "connected-components-3d>=3.20",
  "nibabel>=5.0",
  "h5py>=3.8",
]

[project.optional-dependencies]
biology = ["matplotlib>=3.8"]
qa = ["matplotlib>=3.8", "pytest>=8"]

[project.scripts]
mitocensus = "mitocensus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mitocensus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
